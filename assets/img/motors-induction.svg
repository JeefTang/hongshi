<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 675" role="img" aria-label="Totally enclosed fan-cooled high-efficiency induction motor">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fbfc"/><stop offset="1" stop-color="#e8eff3"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d5160"/><stop offset=".45" stop-color="#2b3c49"/><stop offset="1" stop-color="#1b2833"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8e2e8"/><stop offset=".5" stop-color="#a9bac5"/><stop offset="1" stop-color="#7d8f9b"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#465c6c"/><stop offset="1" stop-color="#22323d"/>
    </linearGradient>
  </defs>

  <rect width="900" height="675" fill="url(#bg)"/>
  <path d="M0 560h900v115H0z" fill="#dfe8ee"/>
  <ellipse cx="470" cy="556" rx="330" ry="26" fill="#cdd9e1" opacity=".85"/>

  <!-- base rail -->
  <rect x="250" y="520" width="470" height="18" rx="4" fill="#94a6b2"/>
  <rect x="250" y="520" width="470" height="6" rx="3" fill="#b7c6d0"/>

  <!-- feet -->
  <path d="M300 452h96l18 68h-132z" fill="#1b2833"/>
  <path d="M570 452h96l18 68h-132z" fill="#1b2833"/>
  <rect x="280" y="508" width="136" height="14" rx="3" fill="#0f1a22"/>
  <rect x="550" y="508" width="136" height="14" rx="3" fill="#0f1a22"/>

  <!-- shaft -->
  <rect x="150" y="342" width="120" height="24" rx="4" fill="url(#steel)"/>
  <rect x="150" y="348" width="120" height="5" fill="#eef4f8" opacity=".7"/>
  <rect x="196" y="339" width="16" height="30" rx="2" fill="#8fa2ae"/>

  <!-- end shield left -->
  <rect x="255" y="268" width="34" height="188" rx="12" fill="#1d2b36"/>
  <!-- body -->
  <rect x="282" y="250" width="372" height="206" rx="34" fill="url(#body)"/>
  <!-- cooling fins -->
  <g stroke="#42596a" stroke-width="9" stroke-linecap="round" opacity=".95">
    <path d="M310 268v170"/><path d="M338 264v178"/><path d="M366 262v182"/>
    <path d="M394 260v186"/><path d="M422 260v186"/><path d="M450 260v186"/>
    <path d="M478 260v186"/><path d="M506 260v186"/><path d="M534 260v186"/>
    <path d="M562 262v182"/><path d="M590 264v178"/><path d="M618 268v170"/>
  </g>
  <!-- top highlight -->
  <rect x="300" y="258" width="336" height="10" rx="5" fill="#6a8496" opacity=".5"/>

  <!-- terminal box -->
  <rect x="400" y="176" width="132" height="78" rx="10" fill="url(#cap)"/>
  <rect x="394" y="168" width="144" height="18" rx="6" fill="#50697b"/>
  <rect x="414" y="196" width="104" height="42" rx="6" fill="#16222c"/>
  <g fill="#5d7484"><circle cx="428" cy="208" r="3"/><circle cx="504" cy="208" r="3"/><circle cx="428" cy="226" r="3"/><circle cx="504" cy="226" r="3"/></g>
  <path d="M466 246v6" stroke="#16222c" stroke-width="6"/>

  <!-- end shield right + fan cowl -->
  <rect x="648" y="266" width="30" height="190" rx="10" fill="#1d2b36"/>
  <rect x="672" y="272" width="62" height="178" rx="28" fill="url(#cap)"/>
  <g stroke="#4d6678" stroke-width="5" opacity=".9">
    <path d="M690 288v146"/><path d="M706 284v154"/><path d="M722 288v146"/>
  </g>

  <!-- nameplate -->
  <rect x="410" y="300" width="112" height="62" rx="4" fill="#e9eef2" stroke="#9fb0bc"/>
  <g stroke="#7b8d99" stroke-width="2" opacity=".8">
    <path d="M420 316h92"/><path d="M420 330h92"/><path d="M420 344h64"/>
  </g>

  <!-- floor text -->
  <text x="450" y="620" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="26" fill="#7f92a0" letter-spacing="4">TEFC · IP55 · IC411</text>
</svg>
